<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operación Extracción</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: "Segoe UI", Arial, sans-serif; color: #fff; user-select: none; }
    canvas { display: block; }

    #hud { position: fixed; inset: 0; pointer-events: none; }
    #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; transition: background .1s; }
    #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }
    #crosshair.hit::before, #crosshair.hit::after { background: #ff3b30; }

    #weapons { position: absolute; right: 24px; bottom: 24px; text-align: right; }
    .weapon { margin-top: 6px; padding: 8px 14px; background: rgba(0,0,0,.55); border: 2px solid transparent; border-radius: 6px; font-size: 18px; }
    .weapon.active { border-color: #ffc107; color: #ffc107; }
    .weapon.empty .ammo { color: #ff3b30; }

    #info { position: absolute; left: 24px; top: 20px; background: rgba(0,0,0,.55); padding: 10px 16px; border-radius: 6px; font-size: 16px; line-height: 1.6; }
    #msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 26px; font-weight: bold; text-shadow: 0 0 8px #000; opacity: 0; transition: opacity .3s; text-align: center; }
    #msg.show { opacity: 1; }
    #boost { position: absolute; left: 24px; bottom: 24px; font-size: 18px; color: #4dd0e1; display: none; }

    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.82); text-align: center; padding: 20px; }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 52px; margin: 0 0 10px; letter-spacing: 3px; }
    #overlay h1.red { color: #ff3b30; }
    #overlay h1.green { color: #34c759; }
    #overlay p { max-width: 620px; font-size: 18px; line-height: 1.5; color: #ddd; }
    #overlay button { margin-top: 18px; padding: 14px 36px; font-size: 20px; font-weight: bold; background: #ffc107; border: none; border-radius: 6px; cursor: pointer; }
    #overlay button:disabled { background: #555; cursor: wait; }
    kbd { background: #333; border: 1px solid #666; border-radius: 4px; padding: 1px 7px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="info">
      Zombis vivos: <b id="zLeft">0</b><br>
      Distancia a la extracción: <b id="dist">0</b> m
    </div>
    <div id="msg"></div>
    <div id="boost">⚡ VELOCIDAD</div>
    <div id="weapons">
      <div class="weapon active" id="w1">[1] <span class="name">Pistola</span> — <span class="ammo">0</span></div>
      <div class="weapon" id="w2">[2] <span class="name">Escopeta</span> — <span class="ammo">0</span></div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="ovTitle">OPERACIÓN EXTRACCIÓN</h1>
    <p id="ovText"></p>
    <button id="ovBtn" disabled>Cargando modelos...</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
